<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../../_shared/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f1ec;color:#1e1f24;font-family:Manrope,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:#1e1f24;text-decoration:none}
a:hover{color:#c4553d}
</style>
</helmet>
<div ref="{{ mountRef }}" style="position:fixed;inset:0"></div>
<sc-if value="{{ showUI }}" hint-placeholder-val="{{ true }}">
  <div style="position:fixed;top:16px;left:16px;right:16px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none">
    <a href="../../../pages/projects-hub/prototype.html" style="pointer-events:auto;padding:10px 16px;border-radius:999px;background:rgba(250,248,245,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(30,31,36,.08);font-weight:700;font-size:14px">← Projects</a>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
      <span style="font-weight:800;font-size:18px;letter-spacing:-.02em">Particle Type</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#5d5e66">Project 01 · three.js</span>
    </div>
  </div>
  <div style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;width:min(560px,calc(100% - 32px));display:flex;flex-direction:column;gap:10px;align-items:center">
    <div style="width:100%;display:flex;gap:8px;padding:8px;border-radius:999px;background:rgba(250,248,245,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(30,31,36,.08);box-shadow:0 20px 40px -24px rgba(30,31,36,.4);box-sizing:border-box">
      <input value="{{ text }}" onChange="{{ onText }}" maxLength="14" placeholder="Type a word" style="flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 16px;font-family:Manrope,sans-serif;font-size:18px;font-weight:700;color:#1e1f24;letter-spacing:.02em">
      <button onClick="{{ onScatter }}" style="border:0;cursor:pointer;padding:12px 18px;border-radius:999px;background:rgba(30,31,36,.07);font-family:Manrope,sans-serif;font-weight:700;font-size:14px;color:#1e1f24" style-hover="background:rgba(30,31,36,.14)">Scatter</button>
      <button onClick="{{ onCopy }}" style="border:0;cursor:pointer;padding:12px 18px;border-radius:999px;background:#1e1f24;color:#f4f1ec;font-family:Manrope,sans-serif;font-weight:700;font-size:14px;white-space:nowrap">{{ copyLabel }}</button>
    </div>
    <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#5d5e66;text-align:center">Type to reshape · move the cursor to push · click to scatter</span>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { text: 'HELLO', copied: false, showUI: true };
  mountRef = React.createRef();

  componentDidMount() {
    this.preview = new URLSearchParams(location.search).has('preview');
    const m = location.hash.match(/w=([^&]+)/);
    const text = m ? decodeURIComponent(m[1]).slice(0, 14) : 'HELLO';
    this.setState({ showUI: !this.preview, text });
    this.init(text);
  }
  componentWillUnmount() {
    this.dead = true; cancelAnimationFrame(this.raf); clearInterval(this.cycle);
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('pointermove', this.onMove);
    if (this.renderer) this.renderer.dispose();
  }

  sample(word) {
    const N = this.N, R = Math.random, out = new Float32Array(N * 3);
    const c = document.createElement('canvas'); c.width = 1200; c.height = 330;
    const ctx = c.getContext('2d');
    ctx.font = '800 200px Manrope, sans-serif';
    const w = ctx.measureText(word || ' ').width;
    const fs = Math.min(230, 200 * 1100 / Math.max(w, 1));
    ctx.font = `800 ${fs}px Manrope, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
    ctx.fillText(word, 600, 170);
    const d = ctx.getImageData(0, 0, 1200, 330).data, pts = [];
    for (let y = 0; y < 330; y += 2) for (let x = 0; x < 1200; x += 2) if (d[(y * 1200 + x) * 4 + 3] > 128) pts.push(x, y);
    const k = Math.min(this.halfW * 1.7, 8) / 1100;
    for (let i = 0; i < N; i++) {
      if (pts.length) {
        const j = Math.floor(R() * pts.length / 2) * 2;
        out[i * 3] = (pts[j] - 600 + (R() - .5) * 2.5) * k;
        out[i * 3 + 1] = -(pts[j + 1] - 170 + (R() - .5) * 2.5) * k;
        out[i * 3 + 2] = (R() - .5) * 0.35;
      } else {
        const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), ph = i * 2.39996;
        out[i * 3] = Math.cos(ph) * r * 1.3; out[i * 3 + 1] = y * 1.3; out[i * 3 + 2] = Math.sin(ph) * r * 1.3;
      }
    }
    return out;
  }
  setWord(w) { this.word = w; if (this.target) this.target = this.sample(w); }
  scatter() {
    if (!this.vel) return;
    for (let i = 0; i < this.vel.length; i++) this.vel[i] += (Math.random() - .5) * 0.5;
  }

  async init(text) {
    const T = await import('https://unpkg.com/three@0.160.0/build/three.module.js');
    try { await document.fonts.load('800 200px Manrope'); } catch (e) {}
    if (this.dead || !this.mountRef.current) return;
    const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    this.mountRef.current.appendChild(renderer.domElement);
    this.renderer = renderer;
    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 50);
    camera.position.z = 7;
    const calcHalf = () => { const hh = Math.tan(17.5 * Math.PI / 180) * 7; this.halfH = hh; this.halfW = hh * camera.aspect; };
    calcHalf();

    this.N = 7000;
    const N = this.N;
    this.word = text;
    this.target = this.sample(text);
    const pos = new Float32Array(N * 3), rnd = new Float32Array(N);
    for (let i = 0; i < N * 3; i++) pos[i] = (Math.random() - .5) * 14;
    for (let i = 0; i < N; i++) rnd[i] = Math.random();
    this.vel = new Float32Array(N * 3);
    const geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(pos, 3));
    geo.setAttribute('aRand', new T.BufferAttribute(rnd, 1));
    const mat = new T.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uPR: { value: renderer.getPixelRatio() }, uSize: { value: 30 } },
      vertexShader: `
        attribute float aRand; uniform float uTime; uniform float uPR; uniform float uSize; varying vec3 vCol;
        void main(){
          vec3 p = position; p.z += sin(uTime*1.3 + aRand*6.28 + p.x)*0.04;
          vec4 mv = modelViewMatrix*vec4(p,1.);
          gl_Position = projectionMatrix*mv;
          gl_PointSize = uSize*mix(.6,1.3,fract(aRand*13.7))*uPR/(-mv.z);
          vCol = mix(vec3(.424,.765,.812), vec3(.945,.604,.51), smoothstep(-3.,3.,p.x + sin(aRand*6.28)*.5));
        }`,
      fragmentShader: `
        varying vec3 vCol;
        void main(){
          vec2 c = gl_PointCoord*2.-1.; float r2 = dot(c,c); if(r2>1.) discard;
          vec3 n = vec3(c.x,-c.y,sqrt(1.-r2)); vec3 L = normalize(vec3(-.5,.7,.6));
          float diff = max(dot(n,L),0.); float spec = pow(max(dot(reflect(-L,n),vec3(0,0,1)),0.),28.);
          gl_FragColor = vec4(vCol*(.62+.5*diff)+spec*.3, 1.);
        }`
    });
    const points = new T.Points(geo, mat); points.frustumCulled = false; scene.add(points);

    const mouse = { x: 99, y: 99, last: 0 };
    this.onMove = e => { mouse.x = (e.clientX / innerWidth * 2 - 1) * this.halfW; mouse.y = -(e.clientY / innerHeight * 2 - 1) * this.halfH; mouse.last = performance.now(); };
    this.onResize = () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); calcHalf(); this.setWord(this.word); };
    window.addEventListener('pointermove', this.onMove);
    window.addEventListener('resize', this.onResize);
    renderer.domElement.addEventListener('pointerdown', () => this.scatter());

    if (this.preview) {
      const words = ['HELLO', 'CODE', 'PLAY']; let wi = 0;
      this.cycle = setInterval(() => { wi = (wi + 1) % words.length; this.setWord(words[wi]); }, 2800);
    }
    const t0 = performance.now();
    const loop = () => {
      if (this.dead) return;
      this.raf = requestAnimationFrame(loop);
      const now = performance.now(), tg = this.target, v = this.vel;
      const active = now - mouse.last < 1200;
      for (let i = 0; i < N; i++) {
        const k = i * 3;
        v[k] = v[k] * 0.9 + (tg[k] - pos[k]) * 0.02;
        v[k + 1] = v[k + 1] * 0.9 + (tg[k + 1] - pos[k + 1]) * 0.02;
        v[k + 2] = v[k + 2] * 0.9 + (tg[k + 2] - pos[k + 2]) * 0.02;
        if (active) {
          const dx = pos[k] - mouse.x, dy = pos[k + 1] - mouse.y, d2 = dx * dx + dy * dy;
          if (d2 < 0.45) { const f = (0.45 - d2) * 0.09 / (Math.sqrt(d2) + 0.01); v[k] += dx * f; v[k + 1] += dy * f; v[k + 2] += 0.02; }
        }
        pos[k] += v[k]; pos[k + 1] += v[k + 1]; pos[k + 2] += v[k + 2];
      }
      geo.attributes.position.needsUpdate = true;
      mat.uniforms.uTime.value = (now - t0) / 1000;
      mat.uniforms.uSize.value = 30 * Math.max(0.7, innerHeight / 900);
      points.rotation.y = mouse.x > 50 ? 0 : points.rotation.y + ((mouse.x / this.halfW) * 0.15 - points.rotation.y) * 0.05;
      renderer.render(scene, camera);
    };
    loop();
  }

  renderVals() {
    return {
      mountRef: this.mountRef,
      showUI: this.state.showUI,
      text: this.state.text,
      copyLabel: this.state.copied ? 'Copied' : 'Copy link',
      onText: e => { const t = e.target.value.toUpperCase(); this.setState({ text: t }); this.setWord(t); },
      onScatter: () => this.scatter(),
      onCopy: () => {
        const url = location.href.split('#')[0] + '#w=' + encodeURIComponent(this.state.text);
        try { history.replaceState(null, '', url); } catch (e) {}
        if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
        this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1500);
      }
    };
  }
}
</script>
</body>
</html>
