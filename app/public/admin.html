<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin</title>
<style>
:root{--bg:#eef1f4;--ink:#101828;--muted:#5b6676;--line:#b9c2cf;--accent:#2437d9;--accent-ink:#fff;--err:#b42318;--display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--body:system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#12161d;--ink:#eef1f4;--muted:#98a3b3;--line:#3a4352;--accent:#8da0ff;--accent-ink:#101828;--err:#ff8f85;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:460px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(2.6rem,11vw,4.2rem);line-height:1.02;letter-spacing:-.02em;margin:0 0 16px}
p{color:var(--muted);font-size:1.05rem;line-height:1.5;margin:0 0 28px;max-width:38ch}
label{display:block;font-weight:600;margin-bottom:8px}
input{width:100%;font:inherit;font-size:1.1rem;padding:14px 16px;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:6px}
button.main{margin-top:14px;width:100%;font:inherit;font-weight:600;font-size:1.05rem;padding:14px 16px;border:0;border-radius:6px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.main:disabled{opacity:.6;cursor:default}
button.main.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.codes{display:flex;gap:10px;margin-bottom:6px}
.codes input{flex:1;min-width:0;text-align:center;font-family:var(--display);font-weight:600;font-size:2rem;padding:12px 0}
.codes input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.codes.bad input{border-color:var(--err)}
.codes.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.codes.bad{animation:none}}
.msg{min-height:1.4em;color:var(--err);margin:8px 0 0;font-size:.95rem}
.small{color:var(--muted);font-size:.95rem;margin-top:22px}
.req{border:2px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px}
.req span{color:var(--muted);font-size:.95rem}
.row{display:flex;gap:10px}.row .main{margin-top:14px}
.hello{font-size:clamp(3.4rem,17vw,9rem)}
[hidden]{display:none!important}
</style>
</head><body><main>
<section id="login">
  <h1>Admin</h1>
  <p>Sign in with your email. We’ll send a 6-digit code.</p>
  <label for="email">Email address</label>
  <input id="email" type="email" autocomplete="email">
  <div id="codebox" hidden style="margin-top:16px"><label for="code">6-digit code</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
  <p class="msg" id="msg"></p>
  <button class="main" id="go">Send code</button>
</section>
<section id="list" hidden>
  <h1>Requests</h1>
  <p id="count"></p>
  <div id="items"></div>
  <p class="small"><button class="link" id="out">Sign out</button></p>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
let step = 0;
async function api(path, body) {
  try {
    const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    let d = {}; try { d = await r.json(); } catch {}
    return { ok: r.ok, d };
  } catch { return { ok: false, d: { error: 'No connection. Try again.' } }; }
}
async function load() {
  const r = await api('/api/admin/list');
  if (!r.ok) { $('login').hidden = false; $('list').hidden = true; $('msg').textContent = 'Sign in as the admin email.'; step = 0; $('go').textContent = 'Send code'; return; }
  $('login').hidden = true; $('list').hidden = false;
  const items = r.d.items, box = $('items'); box.textContent = '';
  const waiting = items.filter(i => i.status === 'pending').length;
  $('count').textContent = waiting ? waiting + (waiting === 1 ? ' person is' : ' people are') + ' waiting for approval.' : 'No one is waiting.';
  for (const it of items) {
    const d = document.createElement('div'); d.className = 'req';
    const n = document.createElement('strong'); n.textContent = it.name;
    const s = document.createElement('span'); s.textContent = it.email + ' · ' + it.status + ' · ' + new Date(it.created).toLocaleDateString();
    d.append(n, document.createElement('br'), s);
    const row = document.createElement('div'); row.className = 'row';
    const add = (label, decision, alt) => { const b = document.createElement('button'); b.className = 'main' + (alt ? ' alt' : ''); b.textContent = label; b.onclick = async () => { b.disabled = true; await api('/api/admin/decide', { email: it.email, decision }); load(); }; row.append(b); };
    if (it.status !== 'approved') add('Approve', 'approve', false);
    if (it.status !== 'rejected') add(it.status === 'approved' ? 'Remove access' : 'Reject', 'reject', true);
    d.append(row); box.append(d);
  }
}
$('go').onclick = async () => {
  const email = $('email').value.trim(); $('msg').textContent = ''; $('go').disabled = true;
  if (step === 0) {
    const r = await api('/api/request', { email, name: 'Admin' });
    if (r.ok) { step = 1; $('codebox').hidden = false; $('go').textContent = 'Confirm code'; $('code').focus(); } else $('msg').textContent = r.d.error || 'Something went wrong.';
  } else {
    const r = await api('/api/verify', { email, code: $('code').value.trim() });
    if (r.ok) load(); else $('msg').textContent = r.d.error || 'Something went wrong.';
  }
  $('go').disabled = false;
};
$('out').onclick = async () => { await api('/api/logout', {}); location.reload(); };
load();
</script></body></html>
